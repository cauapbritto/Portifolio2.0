<div class="fx-ceu" data-fx="ceu">
  <canvas class="fx-ceu__sky" aria-hidden="true"></canvas>
  <div class="fx-ceu__content">
    <div class="fx-ceu__top">
      <p class="fx-ceu__label"><span class="fx-ceu__square" aria-hidden="true"></span>Portfólio · 2026</p>
      <p class="fx-ceu__hint" aria-hidden="true">
        <span class="fx-ceu__hint-mouse">Passe o cursor pelo céu</span>
        <span class="fx-ceu__hint-touch">Toque no céu</span>
      </p>
    </div>
    <div class="fx-ceu__bottom">
      <p class="fx-ceu__wordmark"><span class="fx-sr">Cauanzera</span><span class="fx-ceu__word" aria-hidden="true">Cauanzera</span></p>
      <div class="fx-ceu__row">
        <p class="fx-ceu__tagline">Desenvolvedor front-end em formação, focado em experiências visuais e interfaces imersivas.</p>
        <button class="fx-ceu__replay" type="button">
          <svg class="fx-ceu__replay-icon" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" focusable="false"><path d="M3.2 6.2A5 5 0 1 1 3 9.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M2.6 2.8v3.6h3.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Repetir entrada
        </button>
      </div>
    </div>
  </div>
</div>
