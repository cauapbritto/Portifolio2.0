<div class="fx-entrada" data-fx="entrada">
  <div class="fx-entrada__top">
    <p class="fx-entrada__kicker fx-label" style="--i:0"><span class="fx-entrada__square" aria-hidden="true"></span>Seção de exemplo</p>
    <button class="fx-entrada__replay" type="button">
      <svg class="fx-entrada__replay-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M2.75 8a5.25 5.25 0 1 0 1.6-3.78" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M4.25 1.75v2.75H7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Rever animação</span>
    </button>
  </div>

  <h3 class="fx-entrada__title"><span class="fx-entrada__mask"><span class="fx-entrada__line" style="--i:0">Sobre</span></span></h3>
  <span class="fx-entrada__rule" style="--i:1" aria-hidden="true"></span>

  <div class="fx-entrada__grid">
    <p class="fx-entrada__text" style="--i:2">[3 ou 4 frases do seu jeito: quem você é, como começou a programar e o que mais gosta de construir]</p>

    <div class="fx-entrada__side">
      <dl class="fx-entrada__facts">
        <div class="fx-entrada__row" style="--i:3">
          <dt class="fx-label">Agora</dt>
          <dd>[O que você está estudando]</dd>
        </div>
        <div class="fx-entrada__row" style="--i:4">
          <dt class="fx-label">Ferramentas</dt>
          <dd>HTML, CSS, JavaScript, Canvas&nbsp;2D, Git e GitHub</dd>
        </div>
        <div class="fx-entrada__row" style="--i:5">
          <dt class="fx-label">Onde</dt>
          <dd>[Sua cidade]</dd>
        </div>
      </dl>

      <ul class="fx-entrada__chips" role="list" aria-label="Tecnologias">
        <li class="fx-entrada__chip" style="--i:0">HTML</li>
        <li class="fx-entrada__chip" style="--i:1">CSS</li>
        <li class="fx-entrada__chip" style="--i:2">JavaScript</li>
        <li class="fx-entrada__chip" style="--i:3">Canvas 2D</li>
        <li class="fx-entrada__chip" style="--i:4">Git</li>
      </ul>
    </div>
  </div>
</div>
