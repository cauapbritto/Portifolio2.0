<div class="fx-contato" data-fx="contato">
  <p class="fx-contato__label fx-label">
    <span class="fx-contato__label-text">E-mail</span>
    <span class="fx-contato__hint" aria-hidden="true"></span>
  </p>
  <p class="fx-contato__email"><span class="fx-contato__user">caua.pbritto</span><wbr><span class="fx-contato__domain">@gmail.com</span></p>
  <div class="fx-contato__bar">
    <span class="fx-contato__magnet">
      <button class="fx-contato__btn" type="button">
        <span class="fx-contato__face">
          <span class="fx-contato__state fx-contato__state--idle">

          </span>
          <span class="fx-contato__state fx-contato__state--done" aria-hidden="true">
            <svg class="fx-contato__icon fx-contato__check" viewBox="0 0 16 16" width="16" height="16" focusable="false"><path d="M2.75 8.5 6.25 12 13.25 4.25" pathLength="1" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Copiado</span>
          </span>
        </span>
      </button>
    </span>
    <ul class="fx-contato__links" role="list">
      <li>
        <a class="fx-contato__link" href="https://github.com/cauapbritto" target="_blank" rel="noopener noreferrer"><span class="fx-contato__link-text">GitHub</span><svg class="fx-contato__arrow" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M4.5 11.5 11.5 4.5M5.5 4.5h6v6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="fx-sr"> (abre em nova aba)</span></a>
      </li>
      <li>
        <a class="fx-contato__link" href="https://www.linkedin.com/in/cau%C3%A3-pedrozo-brito-8a685b358" target="_blank" rel="noopener noreferrer"><span class="fx-contato__link-text">LinkedIn</span><svg class="fx-contato__arrow" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M4.5 11.5 11.5 4.5M5.5 4.5h6v6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="fx-sr"> (abre em nova aba)</span></a>
