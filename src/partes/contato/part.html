<section class="contato" id="contato" data-capitulo="03" data-nome="Contato" aria-labelledby="contato-t">

    <span class="contato__orbita contato__orbita--1"><i></i></span>
    <span class="contato__orbita contato__orbita--2"><i></i></span>
  </div>

  <div class="contato__miolo">

    <p class="contato__titulo" data-revelar="mascara"><span>Vamos conversar?</span></p>
    <p class="contato__texto" data-revelar style="--i:1">Quer trocar uma ideia, propor um projeto ou só dizer oi? O e-mail é o caminho mais curto.</p>
    <div class="email" data-revelar style="--i:2">
      <p class="email__label rotulo">
        <span class="email__label-text">E-mail</span>
        <span class="email__hint" aria-hidden="true"></span>
      </p>
      <p class="email__email"><span class="email__user">caua.pbritto</span><wbr><span class="email__domain">@gmail.com</span></p>
      <div class="email__bar">
        <span class="email__magnet">
          <button class="email__btn" type="button" data-cursor="copiar">
            <span class="email__face">

              </span>

                <svg class="email__icon email__check" viewBox="0 0 16 16" width="16" height="16" focusable="false"><path d="M2.75 8.5 6.25 12 13.25 4.25" pathLength="1" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Copiado</span>
              </span>
            </span>
          </button>
        </span>
        <ul class="email__links" role="list">
          <li>
            <a class="email__link" href="https://github.com/cauapbritto" target="_blank" rel="noopener noreferrer"><span class="email__link-text">GitHub</span><svg class="email__arrow" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M4.5 11.5 11.5 4.5M5.5 4.5h6v6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="sr"> (abre em nova aba)</span></a>
          </li>
          <li>
            <a class="email__link" href="https://www.linkedin.com/in/cau%C3%A3-pedrozo-brito-8a685b358" target="_blank" rel="noopener noreferrer"><span class="email__link-text">LinkedIn</span><svg class="email__arrow" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M4.5 11.5 11.5 4.5M5.5 4.5h6v6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="sr"> (abre em nova aba)</span></a>
