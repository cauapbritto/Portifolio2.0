<script>
  // Antes de pintar: marca que há JS e aplica o tema, a fonte e o idioma salvos, para a página não piscar.
  // Fonte: "titulos" (antiga nos títulos) por padrão, "tudo" ou "nova" (sem data-font).
  // Idioma: ?lang=en|pt no endereço, senão a escolha salva, senão inglês só para quem não tem
  // português entre os idiomas do navegador (robôs de busca ficam no português).
  (function () {
    var d = document.documentElement;
    var f = 'titulos';
    var l = (/[?&]lang=(en|pt)(&|$)/.exec(location.search) || [])[1];
    d.classList.add('js');
    try {
      var t = localStorage.getItem('cz-tema');
      if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
      if (localStorage.getItem('cz-movimento') === 'calmo') d.classList.add('calmo');
      var v = localStorage.getItem('cz-fonte') || localStorage.getItem('g-font');
      if (v === 'titulos' || v === 'tudo' || v === 'nova') f = v;
      if (!l) l = localStorage.getItem('cz-idioma');
    } catch (e) {}
    if (f === 'nova') d.removeAttribute('data-font');
    else d.setAttribute('data-font', f);
    if (l !== 'en' && l !== 'pt') {
      var ls = navigator.languages || [navigator.language || ''];
      l = /bot|crawl|spider|slurp|lighthouse/i.test(navigator.userAgent) ? 'pt' : 'en';
      for (var i = 0; i < ls.length; i++) if (/^pt/i.test(ls[i])) l = 'pt';
    }
    // Em inglês o texto troca no fim do carregamento; até lá a página espera escondida (no máximo 1,5 s).
    if (l === 'en') {
      d.lang = 'en';
      d.classList.add('traduzindo');
      setTimeout(function () { d.classList.remove('traduzindo'); }, 1500);
    }
  })();
</script>
