<script>
  // Antes de pintar: marca que há JS e aplica o tema e a fonte salvos, para a página não piscar.
  // Fonte: "titulos" (antiga nos títulos) por padrão, "tudo" ou "nova" (sem data-font).
  (function () {
    var d = document.documentElement;
    var f = 'titulos';
    d.classList.add('js');
    try {
      var t = localStorage.getItem('cz-tema');
      if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
      var v = localStorage.getItem('cz-fonte') || localStorage.getItem('g-font');
      if (v === 'titulos' || v === 'tudo' || v === 'nova') f = v;
    } catch (e) {}
    if (f === 'nova') d.removeAttribute('data-font');
    else d.setAttribute('data-font', f);
  })();
</script>

/* Zero Hour, a fonte do site antigo, em três tamanhos do mesmo arquivo:
   "Zero Hour" no nome Cauanzera, "Zero Hour UI" (86%) em títulos, botões e rótulos e "Zero Hour Texto" (80%)
   no texto corrido, porque ela é toda em maiúsculas e bem mais larga. font-weight 100 900: ela só tem um peso,
   assim o navegador não inventa um negrito falso. Sem o "~" (U+007E), que nela é um traço reto. */
@font-face { font-family: "Zero Hour"; src: url("assets/ZeroHour.woff2") format("woff2"); font-display: swap; font-weight: 100 900; }
@font-face { font-family: "Zero Hour UI"; src: url("assets/ZeroHour.woff2") format("woff2"); font-display: swap; size-adjust: 86%; font-weight: 100 900; unicode-range: U+0000-007D, U+007F-10FFFF; }
@font-face { font-family: "Zero Hour Texto"; src: url("assets/ZeroHour.woff2") format("woff2"); font-display: swap; size-adjust: 80%; font-weight: 100 900; unicode-range: U+0000-007D, U+007F-10FFFF; }
</style>
